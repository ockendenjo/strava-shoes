name: tf

on:
  workflow_call:
    inputs:
      apply:
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_REGION:
        required: true
      TF_STATE_BUCKET:
        required: true

permissions: {}

jobs:
  tf:
    name: tf
    runs-on: ubuntu-latest
    environment: pro
    timeout-minutes: 10
    permissions:
      id-token: write # AWS OIDC
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: get terraform config
        working-directory: stack
        run: |
          mkdir -p tfvars
          aws s3 sync "s3://${TF_STATE_BUCKET}/tfvars/" tfvars/
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - name: init
        working-directory: stack
        run: |
          terraform init -backend-config=tfvars/backend-pro.hcl

      - name: plan
        if: ${{ !inputs.apply }}
        working-directory: stack
        run: |
          terraform plan -var-file="tfvars/pro.tfvars"

      - name: apply
        if: ${{ inputs.apply }}
        working-directory: stack
        run: |
          terraform apply -auto-approve -var-file="tfvars/pro.tfvars"
